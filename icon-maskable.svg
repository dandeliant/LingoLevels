<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4a93f"/>
      <stop offset="0.55" stop-color="#d97706"/>
      <stop offset="1" stop-color="#ff6b9d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Maskable: full bleed background, mark inside safe area (~40% radius from center). -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="256" fill="url(#glow)"/>
  <g fill="#fffcf5" font-family="'Playfair Display', Georgia, serif" font-weight="900" text-anchor="middle">
    <text x="220" y="340" font-size="220">L</text>
    <text x="332" y="260" font-size="140">↑</text>
  </g>
</svg>
